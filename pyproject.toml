[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "netryx-nova"
version = "1.0.0"
description = "Fork of Netryx Astra V2 — modular image geolocation with FAISS retrieval and MASt3R dense matching"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "Pillow",
    "scikit-learn",
    "aiohttp",
    "huggingface-hub",
    "requests",
    "safetensors",
    "einops",
    "timm",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "websockets",
    "faiss-cpu",
    "python-dotenv",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]